name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      # The dynamic range tests decode the fixtures with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: pnpm check

      - name: Build
        run: pnpm build
